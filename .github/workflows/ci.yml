name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test tests/App.Tests/App.Tests.csproj -c Release

  build:
    name: Build app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The XAML compiler only runs on Windows: this job is the one that catches XAML errors.
      - name: Build
        run: dotnet build src/App/App.csproj -c Debug -p:Platform=x64
